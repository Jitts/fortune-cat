<!--
  Mockup 2 — the full-body cat as a standalone file.

  This is app/app/components/FortuneCat.tsx in its `saving` state, flattened to
  a static SVG. Path-for-path identical; the only changes are a fixed gradient
  id (the component uses useId because the dashboard mounts the cat twice and a
  shared id makes every url(#...) resolve to the hidden copy) and the 金 glyph
  left as text, which is fine in an <img> and gets traced if this ever has to
  render without a CJK font.

  Deliberately NOT a redesign. The app has one mark and it is this one; the gap
  the spec found is that no FILE of it exists, so the landing pages and the OG
  card have nothing to point at. That gap is what this closes.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" role="img" aria-label="Fortune cat, content">
  <defs>
    <linearGradient id="fc-leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4d888"/>
      <stop offset="1" stop-color="#e8bd54"/>
    </linearGradient>
  </defs>

  <!-- ears -->
  <path d="M27 38 L30 15 L46 31 Z" fill="url(#fc-leaf)" stroke="#6f4e0d" stroke-width="2" stroke-linejoin="round"/>
  <path d="M73 38 L70 15 L54 31 Z" fill="url(#fc-leaf)" stroke="#6f4e0d" stroke-width="2" stroke-linejoin="round"/>
  <path d="M31 33 L33 22 L41 30 Z" fill="#fbf3dd"/>
  <path d="M69 33 L67 22 L59 30 Z" fill="#fbf3dd"/>

  <!-- body -->
  <path d="M24 74 Q24 92 50 92 Q76 92 76 74 Q76 62 50 62 Q24 62 24 74 Z"
        fill="url(#fc-leaf)" stroke="#6f4e0d" stroke-width="2" stroke-linejoin="round"/>

  <!-- raised beckoning paw -->
  <circle cx="78" cy="55" r="8" fill="url(#fc-leaf)" stroke="#6f4e0d" stroke-width="2"/>
  <!-- resting paw -->
  <ellipse cx="34" cy="82" rx="7" ry="5" fill="#fbf3dd" stroke="#6f4e0d" stroke-width="1.4"/>

  <!-- head -->
  <circle cx="50" cy="46" r="27" fill="url(#fc-leaf)" stroke="#6f4e0d" stroke-width="2"/>
  <ellipse cx="50" cy="52" rx="13" ry="9" fill="#fbf3dd"/>

  <!-- eyes closed — `saving` -->
  <path d="M36 44 q5 5 10 0" stroke="#6f4e0d" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <path d="M54 44 q5 5 10 0" stroke="#6f4e0d" stroke-width="2.4" fill="none" stroke-linecap="round"/>

  <!-- nose + smile -->
  <path d="M48.5 49 h3 l-1.5 2 Z" fill="#6f4e0d"/>
  <path d="M45 54 q5 4 10 0" stroke="#6f4e0d" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- whiskers -->
  <path d="M28 45 l-9 -2 M28 49 l-9 2" stroke="#6f4e0d" stroke-width="1.3" stroke-linecap="round" opacity="0.5"/>
  <path d="M72 45 l9 -2 M72 49 l9 2" stroke="#6f4e0d" stroke-width="1.3" stroke-linecap="round" opacity="0.5"/>

  <!-- bell collar -->
  <path d="M34 62 Q50 70 66 62" stroke="#cf9528" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <circle cx="50" cy="67" r="3.4" fill="#f4d888" stroke="#6f4e0d" stroke-width="1.2"/>
  <path d="M47 67 h6" stroke="#6f4e0d" stroke-width="0.9"/>

  <!-- koban at the paw -->
  <ellipse cx="82" cy="70" rx="10" ry="7" fill="#f4d888" stroke="#6f4e0d" stroke-width="1.6" transform="rotate(-14 82 70)"/>
  <text x="82" y="73.5" text-anchor="middle" font-size="8" font-weight="700" fill="#6f4e0d"
        font-family="serif" transform="rotate(-14 82 70)">&#x91D1;</text>
</svg>
